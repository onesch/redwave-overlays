{% extends "base/base_overlay.html" %}

{% block title %}Radar{% endblock %}

{% block content %}
<div class="radar-container">
    <div class="radar-line horizontal"></div>
    <div class="radar-line vertical"></div>

    <div class="my-car"></div>

    <!-- front/rear lines -->
    <div id="fb-ahead" class="fb-box ahead">
        <div class="clipper"></div>
    </div>
    <div id="fb-behind" class="fb-box behind">
        <div class="clipper"></div>
    </div>

    <!-- side -->
    <div id="side-left"  class="side-box left"></div>
    <div id="side-right" class="side-box right"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
// Handles fetching data and rendering the radar overlay
class RadarUpdater extends BaseUpdater {
    constructor() {
        super({ endpoint: '/api/radar', updateInterval: 100, overlayName: 'radar' });
        // Height of the radar area in pixels.
        this.RADAR_H = 260;
        // Vertical center of the radar used as the reference point for positioning.
        this.CENTER_Y = this.RADAR_H / 2;
    }

    async init() {
        await super.init();

        // Get saved radar visibility mode
        this.radarMode = await window.electronAPI.getRadarVisibility?.('radar');

        // Listen for updates to the radar visibility mode
        window.electronAPI.onRadarVisibilityUpdate?.((mode) => {
            this.radarMode = mode;
        });
    }

    async renderOverlay(data) {
        this.renderRadar(data);
    }

    // Front/rear lane control
    setFB(el, dist, severity) {
        el.classList.remove("sev-red","sev-yellow","sev-gray");

        if(dist == null){
            el.style.opacity = 0;
            return;
        }
        el.style.opacity = 1;

        switch(severity){
            case "red": el.classList.add("sev-red"); break;
            case "yellow": el.classList.add("sev-yellow"); break;
            default: el.classList.add("sev-gray");
        }
    }

    // Side indicator controls
    setSide(el, info, bothSides) {
        el.classList.remove("red", "gray");

        if (!info) {
            el.remove();
            return;
        }

        const BOX_H = 40;
        const offsetRatio = bothSides ? 0 : info.offset_ratio;

        const offsetPx =
            offsetRatio * (this.RADAR_H / 2 - BOX_H / 2);

        // Position the car based on the offset
        el.style.top =
            (this.CENTER_Y - BOX_H - offsetPx - 20) + "px";

        el.style.opacity = 1;
        el.classList.add("red");
    }

    // Render DOM elements
    renderRadar(data) {
        this.setFB(document.getElementById("fb-ahead"), data.ahead_m, data.ahead_severity);
        this.setFB(document.getElementById("fb-behind"), data.behind_m, data.behind_severity);

        const bothSides = !!(data.left && data.right);

        // Create the left/right car indicator
        // if it was removed when the previous car disappeared.
        // Remove the element to prevent a visual jump
        // from its previous top position when a new car appears.
        if (data.left) {
            const left = this.getSideElement("side-left", "left");
            this.setSide(left, data.left, bothSides);
        } else {
            document.getElementById("side-left")?.remove();
        }

        if (data.right) {
            const right = this.getSideElement("side-right", "right");
            this.setSide(right, data.right, bothSides);
        } else {
            document.getElementById("side-right")?.remove();
        }

        this.updateRadarVisibility(data);
    }

    // Return an existing side indicator
    // or create a fresh one after it was removed.
    getSideElement(id, side) {
        let el = document.getElementById(id);

        if (!el) {
            el = document.createElement("div");
            el.id = id;
            el.className = `side-box ${side}`;
            document.querySelector(".radar-container").appendChild(el);
        }

        return el;
    }

    // Update radar visibility based on the current mode and distances
    updateRadarVisibility(data) {
        const el = document.querySelector(".radar-container");

        const mode = this.radarMode;

        // Always show if any cars are nearby
        if (data.left || data.right) {
            el.style.display = 'block';
            el.style.opacity = 1;
            return;
        }

        // Always show overlay
        if (mode === 'show') {
            el.style.display = 'block';
            el.style.opacity = 1;
            return;
        }

        // Hide if no cars nearby
        if (mode === 'hide') {
            if (!data.ahead_nearby && !data.behind_nearby) {
                el.style.opacity = 0;
                el.style.pointerEvents = 'none';
                return;
            }
            el.style.opacity = 1;
            el.style.pointerEvents = 'auto';
            return;
        }

        // Dim if no cars nearby
        el.style.display = 'block';

        if (!data.ahead_nearby && !data.behind_nearby) {
            el.style.opacity = 0.35;
        } else {
            el.style.opacity = 1;
        }
    }
}

// Initialize when page loads
document.addEventListener('DOMContentLoaded', async () => {
    const updater = new RadarUpdater();
    await updater.init();
});
</script>
{% endblock %}
