{% extends "base/base_detail.html" %}

{% block title %}Overlays - {{ card_data.title }}{% endblock %}

{% block additional_settings %}
<div class="setting-container">
  <div class="setting-label">Speed:</div>
  <div class="setting-value button-section">
    <button id="kmhBtn" class="active">km/h</button>
    <button id="mphBtn">mph</button>
  </div>
</div>
<div class="range-container">
  <label for="opacityRange">Opacity:</label>

  <div class="range-control-wrapper">
    <span id="opacityValue">1.0</span>
    <input
      id="opacityRange"
      class="range-control"
      type="range"
      min="0"
      max="1"
      step="0.05"
      value="1"
    >
  </div>
</div>
{% endblock %}

{% block overlay_scripts %}
<script type="module">
  import {
    mountOverlaySettings,
    createSpeedUnitSetting,
  } from "{{ url_for('static', path='/js/page_detail/index.js') }}";

  mountOverlaySettings({
    overlayName: 'telemetry',
    settings: [createSpeedUnitSetting],
  });
</script>
{% endblock %}
