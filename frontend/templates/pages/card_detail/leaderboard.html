{% extends "base/base_detail.html" %}

{% block title %}Overlays - {{ card_data.title }}{% endblock %}

{% block additional_settings %}
<div class="setting-container">
  <label class="setting-label" for="lastLapFormat">Last Lap:</label>
  <div class="setting-value">
    <select id="lastLapFormat" aria-label="Last lap time format">
      <option value="MM:SS.sss">MM:SS.sss</option>
      <option value="MM:SS.ss">MM:SS.ss</option>
      <option value="SS.sss">SS.sss</option>
      <option value="SS.ss">SS.ss</option>
    </select>
  </div>
</div>
<div class="range-container">
  <label for="opacityRange">Opacity:</label>

  <div class="range-control-wrapper">
    <span id="opacityValue">1.0</span>
    <input
      id="opacityRange"
      class="range-control"
      type="range"
      min="0"
      max="1"
      step="0.05"
      value="1"
    >
  </div>
</div>
{% endblock %}

{% block overlay_scripts %}
<script type="module">
  import {
    mountOverlaySettings,
    createLastLapFormatSetting,
  } from "{{ url_for('static', path='/js/page_detail/index.js') }}";

  mountOverlaySettings({
    overlayName: 'leaderboard',
    settings: [createLastLapFormatSetting],
  });
</script>
{% endblock %}
