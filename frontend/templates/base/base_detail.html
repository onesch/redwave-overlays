{% block card_detail %}
<div class="detail-top">
  <div class="detail-image">
    <img
      id="trackImage"
      src="{{ card_data.images.main }}"
      alt="{{ card_data.title }}"
      width="300"
      height="300"
      style="object-fit: contain; pointer-events: none; display: block;"
      {% for key, path in card_data.images.items() %}
        data-{{ key }}="{{ path }}"
      {% endfor %}
    >
  </div>
  <div class="detail-info">
    <div class="section-header">
      <h2>{{ card_data.title }}</h2>
      <p>{{ card_data.desc }}</p>
    </div>
    <div class="action-buttons">
      <button id="OpenBtn" class="button primary-btn">Open</button>
      <button
        id="ToggleMovementBtn"
        class="button icon-button tooltip tooltip-left"
        data-tooltip="toggle overlay movement mode (same as ctrl+shift+P)"
      >
        <span class="material-symbols-outlined">lock</span>
      </button>
    </div>
  </div>
</div>

<div id="settings-header" class="section-header">
  <h2>Settings</h2>
  <span class="info-icon tooltip tooltip-right" data-tooltip="customize overlay behavior and appearance"><span class="material-symbols-outlined">info</span></span>
</div>

<div class="settings-container">
  <div class="range-container">
    <label for="zoomRange">Zoom:</label>

    <div class="range-control-wrapper">
      <span id="zoomValue">100%</span>
      <input
        id="zoomRange"
        class="range-control"
        type="range"
        min="50"
        max="200"
        step="10"
        value="100"
      >
    </div>
  </div>

  <div class="setting-container">
    <div class="setting-label">Display:</div>
    <div class="setting-value button-section">
      <button id="DisplayAllTimeBtn" class="active">All Time</button>
      <button id="DisplayTrackBtn">Track</button>
      <button id="DisplayGarageBtn">Garage</button>
    </div>
  </div>

  <div class="setting-container">
    <div class="setting-label">Auto-Start:</div>
    <div class="setting-value button-section">
      <button id="AutoStartOnBtn">On</button>
      <button id="AutoStartOffBtn" class="active">Off</button>
    </div>
  </div>

  {% block additional_settings %}{% endblock %}
</div>

{% block overlay_scripts %}{% endblock %}

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const container = document.querySelector(".settings-container");

    if (!container) return;

    const MAX_VISIBLE_FIELDS = 5;
    const FIELD_SELECTOR =
      ":scope > .setting-container, :scope > .range-container";

    let isScrolling = false;

    function getFields() {
      return [...container.querySelectorAll(FIELD_SELECTOR)];
    }

    function updateSettingsScroll() {
      const fields = getFields();
      const visibleFields = fields.slice(0, MAX_VISIBLE_FIELDS);

      const style = getComputedStyle(container);
      const paddingTop = parseFloat(style.paddingTop) || 0;

      const visibleHeight = visibleFields.reduce((height, field) => {
        const fieldStyle = getComputedStyle(field);
        const marginBottom = parseFloat(fieldStyle.marginBottom) || 0;

        return height + field.getBoundingClientRect().height + marginBottom;
      }, paddingTop);

      container.style.height = `${visibleHeight}px`;
      container.style.overflowY =
        fields.length > MAX_VISIBLE_FIELDS ? "auto" : "hidden";
    }

    container.addEventListener("wheel", (event) => {
      const fields = getFields();

      if (
        fields.length <= MAX_VISIBLE_FIELDS ||
        event.deltaY === 0 ||
        isScrolling
      ) {
        return;
      }

      event.preventDefault();

      const currentScroll = container.scrollTop;
      const containerTop = container.getBoundingClientRect().top;
      const currentIndex = fields.findIndex((field) => {
        return field.getBoundingClientRect().top >= containerTop - 2;
      });

      const index = currentIndex === -1 ? fields.length - 1 : currentIndex;
      const nextIndex = Math.max(
        0,
        Math.min(
          fields.length - 1,
          index + (event.deltaY > 0 ? 1 : -1)
        )
      );

      const targetScroll =
        currentScroll +
        fields[nextIndex].getBoundingClientRect().top -
        containerTop;

      isScrolling = true;

      container.scrollTo({
        top: targetScroll,
        behavior: "auto"
      });

      requestAnimationFrame(() => {
        isScrolling = false;
      });
    }, { passive: false });

    updateSettingsScroll();

    const observer = new ResizeObserver(updateSettingsScroll);

    getFields().forEach((field) => observer.observe(field));

    observer.observe(container);
  });
</script>

<link rel="stylesheet" href="{{ url_for('static', path='/css/card_detail.css') }}">
{% endblock %}
