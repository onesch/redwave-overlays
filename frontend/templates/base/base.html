<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/title_bar.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
</head>
<body class="{% block body_class %}{% endblock %}">
  <!-- The custom title bar is a sticky element that sits above the page content. -->
  <header id="title-bar" class="title-bar">
    <div class="title-bar-drag">
      <img
        class="title-bar-icon"
        src="{{ url_for('static', path='images/app_icon.png') }}"
        alt=""
        aria-hidden="true"
      >
      <span class="title-bar-title">{% block title_bar_title %}RedWave Overlays{% endblock %}</span>
    </div>

    <div class="title-bar-controls">
      <button
        id="title-bar-minimize"
        class="title-bar-button tooltip tooltip-left"
        type="button"
        aria-label="Minimize"
        data-tooltip="minimize"
      >
        <svg viewBox="0 0 10 10" aria-hidden="true" focusable="false">
          <path d="M0.5 5h9" stroke="currentColor" stroke-width="1" fill="none" />
        </svg>
      </button>
      <button
        id="title-bar-close"
        class="title-bar-button title-bar-button--close tooltip tooltip-left"
        type="button"
        aria-label="Close"
        data-tooltip="close"
      >
        <svg viewBox="0 0 10 10" aria-hidden="true" focusable="false">
          <path d="M0.5 0.5l9 9M9.5 0.5l-9 9" stroke="currentColor" stroke-width="1" fill="none" />
        </svg>
      </button>
    </div>
  </header>

  <main>
    {% block content %}
    {% endblock %}
  </main>

  {% block scripts %}
  {% endblock %}
  <script type="module" src="{{ url_for('static', path='/js/title_bar.js') }}"></script>
</body>
</html>
